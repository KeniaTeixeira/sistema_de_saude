services:
  # ===== Backend: Spring Boot (Docker) =====
  - type: web
    name: saude-backend
    runtime: docker
    repo: https://github.com/KeniaTeixeira/sistema_de_saude
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/profissionais

  # ===== Frontend: React (Static Site) =====
  - type: web
    name: saude-frontend
    runtime: static
    repo: https://github.com/KeniaTeixeira/sistema_de_saude
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: saude-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
